name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Full source history privacy audit
        run: python3 tools/release_audit.py --history
      - name: Java, release policy and privacy tests
        run: ./tools/test-host.sh
